version: '3.8'

services:
  backend:
    build:
      context: .
      target: backend
    container_name: lens-cms-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - SITE_URL=https://lens.alperentoker.com
    volumes:
      - ./data:/app/data
    networks:
      - lens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      target: frontend
    container_name: lens-cms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lens-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  lens-network:
    driver: bridge
