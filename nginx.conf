upstream backend_api {
    server 127.0.0.1:3001;
}

# ── Varsayılan Yakalayıcı (Default Server / Catch-All) ─────────
# Doğrudan IP, atoker.dev veya eşleşmeyen diğer tüm host isteklerini yakalar.
# Böylece LENS platformu SADECE lens.atoker.dev adresi üzerinden sunulur.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name lens.atoker.dev;

    root /var/www/lens-blog/dist;
    index index.html;

    # Hide Nginx version from headers
    server_tokens off;
    client_max_body_size 15M;

    # ── Security Headers ──────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Hardened Content Security Policy with local workers and Google Fonts.
    # No 'unsafe-inline' for scripts: the Vite build ships no inline scripts.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # ── Gzip Compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ── Reverse Proxy to Backend API ──────────────────────────────
    location ^~ /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # ── Uploaded Media & Figures (/uploads/) ──────────────────────
    location ^~ /uploads/ {
        alias /var/www/lens-blog/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
    }

    # Uploaded SVGs may contain active content; serve them with a locked-down
    # CSP so a stored SVG can never execute script or load remote resources.
    location ~* ^/uploads/(.*\.svg)$ {
        alias /var/www/lens-blog/data/uploads/$1;
        types { image/svg+xml svg; }
        expires 30d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;
    }

    # ── Dynamic SEO Endpoints (served by Node.js backend) ─────────
    location = /sitemap.xml {
        proxy_pass http://backend_api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /robots.txt {
        proxy_pass http://backend_api/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── RSS Feed (served by Node.js backend) ──────────────────────
    location = /feed.xml {
        proxy_pass http://backend_api/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Dynamic OpenGraph Article Sharing & Social Previews ───────
    # Facebook, LinkedIn, X, Slack, WhatsApp ve OpenGraph.io paylaşımlarında
    # makaleye özel başlık, özet ve kart görseli meta etiketlerini dinamik enjekte eder.
    location ^~ /article/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /makale/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Dynamic OpenGraph Cards Endpoint (/og/:slug.png) ──────────
    location ^~ /og/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── Block dotfiles (.git, .env, etc.) ─────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        return 403;
    }

    # ── Static Asset Caching (Vite hashed filenames in /assets/) ──
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Root static files (favicon, og-image.png, etc.)
    location ~* \.(?:woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA Fallback ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
